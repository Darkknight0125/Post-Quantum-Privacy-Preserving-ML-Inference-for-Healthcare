[package]
name = "ppml-msz-lrs"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["core", "methods"]
resolver = "2"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
msz-lrs-core = { path = "core" }
msz-lrs-methods = { path = "methods" }
pq-mayo = { version = "=0.6.0", default-features = false }
rand = "0.9"
risc0-zkvm = { version = "=3.0.6", features = ["client", "prove", "disable-dev-mode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signature = "3"
